<dialog id="settings-modal" class="modal">
  <div class="modal-box max-w-sm">
    <div class="flex items-start justify-between gap-3">
      <h3 class="font-bold text-lg">Settings</h3>
      <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost" aria-label="Close">✕</button></form>
    </div>
    <div class="flex flex-col gap-4 mt-4 text-sm">
      <label class="flex items-center justify-between gap-3">
        <span class="flex items-center gap-1.5">Markup multiplier <span id="markup-info" class="flex items-center"></span></span>
        <span class="flex items-center gap-2">
          <input type="number" id="markup-input" step="0.01" min="1" class="input input-border input-sm w-24" onchange="onMarkupChange()" />
          <span class="opacity-60 whitespace-nowrap">× base cost</span>
        </span>
      </label>
      <label class="flex items-center justify-between gap-3">
        <span>Thousands separator</span>
        <input type="text" id="thousands-sep-input" maxlength="1" class="input input-border input-sm w-14 text-center" onchange="onSepChange()" title="Thousands separator for all displayed numbers — may be left empty for no grouping" />
      </label>
      <label class="flex items-center justify-between gap-3">
        <span>Decimal separator</span>
        <input type="text" id="decimal-sep-input" maxlength="1" class="input input-border input-sm w-14 text-center" onchange="onSepChange()" title="Decimal separator for all displayed numbers" />
      </label>
      <div class="border-t border-base-300 pt-3 text-xs opacity-50">
        <span id="last-updated"></span>
      </div>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
