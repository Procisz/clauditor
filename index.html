<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Clauditor</title>
		<script>
			(function () {
				var d = document.documentElement.dataset;
				var get = function (k) {
					try {
						return localStorage.getItem(k);
					} catch (e) {
						return null;
					}
				};
				var LIGHT = ["winter", "sand", "mint", "lavender", "sea"];
				var DARK = ["dracula", "midnight", "forest", "graphite", "plum"];
				var mode = get("clauditor_theme");
				if (mode === "winter") mode = "light";
				else if (mode === "dracula") mode = "dark";
				if (mode !== "light" && mode !== "dark" && mode !== "auto") mode = "light";
				var dark = mode === "auto" ? matchMedia("(prefers-color-scheme: dark)").matches : mode === "dark";
				d.theme = dark ? "dark" : "light";
				if (mode === "auto") d.themeAuto = "1";
				var light = get("clauditor_theme_light");
				var night = get("clauditor_theme_dark");
				d.light = LIGHT.indexOf(light) === -1 ? "winter" : light;
				d.dark = DARK.indexOf(night) === -1 ? "dracula" : night;
				var WIDTHS = ["narrow", "normal", "wide", "full"];
				var width = get("clauditor_width");
				d.width = WIDTHS.indexOf(width) === -1 ? "normal" : width;
				var lang = get("clauditor_lang");
				if (lang === "en" || lang === "hu") document.documentElement.lang = lang;
			})();
		</script>

	<body>
		<%- include('src/html/partials/header.html') %>

		<main class="app-main">
			<input
				type="file"
				id="file-input-fallback"
				webkitdirectory
				hidden
				onchange="onCodeFilesPicked(this.files)"
			/>
			<div id="error-banner" class="banner" data-tone="error" role="alert" hidden>
				<svg class="icon" aria-hidden="true"><use href="#i-warn" /></svg>
				<span class="banner-text"></span>
			</div>
			<div id="pricing-warning" class="banner" data-tone="warn" hidden>
				<svg class="icon" aria-hidden="true"><use href="#i-warn" /></svg>
				<span class="banner-text" id="pricing-warning-text"></span>
				<div class="banner-actions">
					<button type="button" class="btn" onclick="openPricingHelp()" data-i18n="shell.howToAdd"></button>
					<button
						type="button"
						class="note-close"
						id="pricing-warning-close"
						data-i18n-attr="aria-label:shell.dismissPricing;title:shell.dismissPricingTip"
					>
						<svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
					</button>
				</div>
			</div>
			<div id="cowork-warning" class="banner" data-tone="warn" hidden>
				<svg class="icon" aria-hidden="true"><use href="#i-warn" /></svg>
				<span class="banner-text" data-i18n="shell.coworkWarning"></span>
				<div class="banner-actions">
					<button type="button" class="btn" onclick="showSources()" data-i18n="shell.dataSources"></button>
					<button
						type="button"
						class="note-close"
						id="cowork-warning-close"
						data-i18n-attr="aria-label:shell.dismissCowork;title:shell.dismissCoworkTip"
					>
						<svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
					</button>
				</div>
			</div>

			<%- include('src/html/partials/welcome.html') %>

			<div id="loading" class="loading-state" role="status" hidden>
				<span class="spinner" aria-hidden="true"></span>
				<p id="loading-text"></p>
			</div>

			<div id="dashboard" hidden>
				<div id="app-main"></div>
			</div>
		</main>

		<script type="module" src="/src/main.js"></script>
	</body>
</html>
